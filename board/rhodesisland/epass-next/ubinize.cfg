# The rootfs MTD partition (0xb60000..0x2760000, 28MiB) is one UBI device
# holding one volume:
#
#   rootfs   read-only system volume, the overlay lower, 24MiB
#
# Fixed size rather than autoresize on purpose. Once overlayed the system
# volume never grows at runtime -- every write lands in the upper on the data
# partition -- so it only grows with the firmware itself. A fixed ceiling
# turns "the image outgrew its partition" into a build failure rather than
# something discovered on a bricked device.
#
# The overlay upper lives on the separate data MTD partition and so is not in
# this image: reflashing rewrites the system and leaves user data alone. That
# UBI device and its volume are created by preinit on first boot, or rebuilt
# there if the partition is ever unreadable.
[rootfs]
mode=ubi
image=BR2_ROOTFS_UBIFS_PATH
vol_id=0
vol_type=dynamic
vol_name=rootfs
vol_size=25165824
vol_alignment=1

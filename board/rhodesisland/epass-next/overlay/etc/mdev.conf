# 基于 package/busybox/mdev.conf 精简:
#   - 去掉本机不存在的设备(grsec/vcsa)
#   - 末尾加上 SD 卡热插拔钩子
# 覆盖 busybox 装的那份 —— rootfs overlay 在包安装之后铺开, 后者被替换掉,
# 没有这份就没有 mmcblk 规则, sd-hotplug 永远不会被调用。
# null/console 可能已存在,所以用 @chmod 修正属主
null		root:root 666 @chmod 666 $MDEV
zero		root:root 666
full		root:root 666
random		root:root 444
urandom		root:root 444
hwrandom	root:root 444

kmem		root:root 640
mem		root:root 640
port		root:root 640
console		root:tty 600 @chmod 600 $MDEV
ptmx		root:tty 666
pty.*		root:tty 660

tty		root:tty 666
tty[0-9]*	root:tty 660
ttyS[0-9]*	root:root 660
ttyUSB[0-9]*	root:root 660

# alsa sound devices
snd/pcm.*	root:audio 660
snd/control.*	root:audio 660
snd/midi.*	root:audio 660
snd/seq		root:audio 660
snd/timer	root:audio 660

# input stuff
input/event[0-9]+	root:root 640
input/mice		root:root 640
input/mouse[0-9]	root:root 640
input/ts[0-9]		root:root 600

# load modules
$MODALIAS=.*	root:root 660 @modprobe "$MODALIAS"

# SD 卡热插拔: * 前缀 add/remove(及其它 action)都会执行,脚本内按 $ACTION 分流
mmcblk0p1	root:root 660 */usr/sbin/sd-hotplug
mmcblk0		root:root 660 */usr/sbin/sd-hotplug
